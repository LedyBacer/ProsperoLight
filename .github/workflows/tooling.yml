name: Build

on:
  # A build on main is started by hand (Run workflow): pushes to main build nothing.
  push:
    branches:
      # Let contributors validate fork branches before upstream workflow approval.
      - "feature/**"
      - dev
      - codex/test-lab
    tags:
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Also upload this run's compiler cache as the next build-cache snapshot (run it on main)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, and build release artifacts
    runs-on: ubuntu-24.04
    # The attest step signs with this run's identity and stores the attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 2G
      # The SDK's compilers are wrapper scripts, new files in every run: what identifies a
      # compiler is the version it reports, not the date of its file.
      CCACHE_COMPILERCHECK: "%compiler% --version"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install shader and Mbed TLS code-generation dependencies
        run: python -m pip install "Jinja2==3.1.6" "jsonschema==4.25.1" "Mako==1.3.10" "PyYAML==6.0.2" "meson==1.7.0" "packaging==25.0"

      - name: Install Test Lab coordinator test dependencies
        run: python -m pip install ./tools/test-lab

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 clang-tidy-18 llvm-18-dev cmake lld-18 make ccache pkg-config tar unzip wget ninja-build bison flex libclang-18-dev libclang-cpp18-dev libclc-18-dev libclc-18 libllvmspirvlib-18-dev spirv-tools glslang-tools libegl-dev libgl-dev libgl1-mesa-dri libpng-dev libturbojpeg0-dev libwebp-dev

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-clang18-

      # GitHub drops a cache nobody used for a week, and a pull request only sees main's. When
      # nothing was restored, start from the snapshot kept as a file of the build-cache release;
      # a manual run with "snapshot" ticked hands over a new one as the ccache-snapshot artifact.
      - name: Fetch the compiler cache snapshot
        run: |
          if [ -z "$(ls -A "$CCACHE_DIR" 2>/dev/null)" ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/build-cache/ccache-clang18.tar"
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache-clang18.tar" "$url"; then
              mkdir -p "$CCACHE_DIR"
              tar -xf "$RUNNER_TEMP/ccache-clang18.tar" -C "$CCACHE_DIR"
              rm "$RUNNER_TEMP/ccache-clang18.tar"
              echo "::notice title=Compiler cache::Started from the build-cache snapshot."
            fi
          fi

      - name: Configure parallel compilation
        run: |
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Read app identity and version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "Release tag must exactly match param.json contentVersion: $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"

      - name: Lint source and metadata
        run: LINT_SKIP_TIDY=1 make lint

      - name: Run host GoogleTest suite
        run: make test-unit test-performance-guards

      - name: Run host integration tests
        run: make test-integration

      - name: Check launcher behavior and layout with software OpenGL
        run: make launcher-check
      - name: Check localized text bounds across all languages
        run: make launcher-layout-check

      - name: Verify scalar and SIMD streaming dependencies on the host
        run: make test-stream-performance

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      # A pull request's build is named by its number and its own commit, on the
      # artifact and on the launcher's About page; the version stays the release's.
      - name: Name this build
        id: label
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=ProsperoLight-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=prosperolight-release-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      # The app folder is the only output; no image is built, here or by a local target.
      - name: Build the release folder
        run: |
          # Validated streaming releases retain the measured build settings.
          case "$CONTENT_VERSION" in
            01.000.062|01.000.070|01.000.080|01.000.090|01.000.095|01.000.100|01.000.110)
              make app FEC_SIMD=1 OPUS_SIMD=1 PERFORMANCE_DETAIL=1 FLIP_POLL_US=200 INPUT_POLL_US=2000 VIDEO_SLICES_PER_FRAME=8
              ;;
            *)
              make app
              ;;
          esac

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      # ccache compresses what it stores, so the snapshot is a plain tar.
      - name: Pack the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: tar -cf "$RUNNER_TEMP/ccache-clang18.tar" -C "$CCACHE_DIR" .

      - name: Upload the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccache-snapshot
          path: ${{ runner.temp }}/ccache-clang18.tar
          if-no-files-found: error
          retention-days: 1

      - name: Archive app folder and write the release checksum
        run: |
          cd dist
          python3 -m zipfile -c "$TITLE_ID.zip" "$TITLE_ID"
          # Every entry stored as 0777: the console only starts an app whose files are open to all.
          python3 ../tools/zip-open-modes.py "$TITLE_ID.zip"
          sha256sum "$TITLE_ID.zip" > SHA256SUMS

      - name: Check that every ZIP entry is stored as 0777
        run: |
          python3 - "dist/$TITLE_ID.zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              entries = archive.infolist()
              wrong = [e.filename for e in entries if (e.external_attr >> 16) & 0o777 != 0o777]
              if not entries or wrong or archive.testzip() is not None:
                  raise SystemExit(f"ZIP entries not stored as 0777: {wrong[:5]}")
              print(f"{len(entries)} entries, all stored as 0777")
          PY

      # Signed provenance: this ZIP was built by this workflow from this commit. Anyone can check a
      # downloaded copy with `gh attestation verify <file> -R <owner>/<repo>`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release ZIP
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.TITLE_ID }}.zip

      - name: Upload build provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prosperolight-provenance-${{ github.sha }}
          path: build/build-provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "prosperolight-release-$GITHUB_SHA"
          --dir release

      - name: Prepare release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(find . -type f -print0)
          if (( ${#files[@]} != 2 )); then
            echo "Expected one app-folder ZIP and SHA256SUMS." >&2
            exit 1
          fi
          mapfile -d '' archives < <(find . -type f -name 'PPSA*.zip' -print0)
          mapfile -d '' checksums < <(find . -type f -name 'SHA256SUMS' -print0)
          if (( ${#archives[@]} != 1 || ${#checksums[@]} != 1 )); then
            echo "Release files must be one app-folder ZIP and SHA256SUMS." >&2
            exit 1
          fi
          (cd "$(dirname "${checksums[0]}")" && sha256sum -c "$(basename "${checksums[0]}")")
          echo "archive=${archives[0]#./}" >> "$GITHUB_OUTPUT"
          echo "checksum=${checksums[0]#./}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        run: |
          awk -v version="$GITHUB_REF_NAME" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=$GITHUB_REF_NAME
          assets=("release/$ARCHIVE" "release/$CHECKSUM")
          release_flags=()
          case "$GITHUB_REF_NAME" in
            01.000.062|01.000.070|01.000.080|01.000.090)
              release_flags=(--prerelease --latest=false)
              ;;
          esac
          # The files of a release come from the run of its tag, once. A release without a
          # ZIP (notes written in advance, or a draft) gets them and keeps its title and
          # notes; one that already has a ZIP is never touched, because the catalog records
          # that ZIP's checksum.
          if names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            has_zip=0
            while IFS= read -r name; do
              if [[ $name == *.zip ]]; then has_zip=1; fi
            done <<< "$names"
            if (( has_zip )); then
              echo "::warning title=Release files not from this run::A release for $TAG already has a ZIP; it was not replaced. Its files were not published by this run and may have no attestation."
            else
              gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes-file release-notes.md \
              --title "ProsperoLight $GITHUB_REF_NAME" "${release_flags[@]}"
          fi
