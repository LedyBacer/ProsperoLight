name: Build

on:
  push:
    branches:
      - main
    tags:
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, and build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Mbed TLS code-generation dependencies
        run: python -m pip install "Jinja2==3.1.6" "jsonschema==4.25.1"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 clang-tidy-18 llvm-18-dev cmake lld-18 make pkg-config python3-venv tar unzip wget

      - name: Read app identity and version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "Release tag must exactly match param.json contentVersion: $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"

      - name: Lint source and metadata
        run: make lint

      - name: Run host GoogleTest suite
        run: make test-unit test-performance-guards

      - name: Run host integration tests
        run: make test-integration

      - name: Verify scalar and SIMD streaming dependencies on the host
        run: make test-stream-performance

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      - name: Build compressed release image
        run: |
          # Performance betas ship with the measured flag set.
          case "$CONTENT_VERSION" in
            01.000.062|01.000.070|01.000.071|01.000.080|01.000.081|01.000.082|01.000.083)
              make ffpfsc FEC_SIMD=1 OPUS_SIMD=1 PERFORMANCE_DETAIL=1 FLIP_POLL_US=200 INPUT_POLL_US=2000 VIDEO_SLICES_PER_FRAME=8
              ;;
            *)
              make ffpfsc
              ;;
          esac

      - name: Archive app folder and write release checksums
        run: |
          cd dist
          python3 -m zipfile -c "$TITLE_ID.zip" "$TITLE_ID"
          sha256sum "$TITLE_ID.ffpfsc" "$TITLE_ID.zip" > SHA256SUMS

      - name: Upload build provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prosperolight-provenance-${{ github.sha }}
          path: build/build-provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prosperolight-release-${{ github.sha }}
          path: |
            dist/${{ env.TITLE_ID }}.ffpfsc
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "prosperolight-release-$GITHUB_SHA"
          --dir release

      - name: Prepare release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(find . -type f -print0)
          if (( ${#files[@]} != 3 )); then
            echo "Expected one FFPFSC image, one app-folder ZIP, and SHA256SUMS." >&2
            exit 1
          fi
          mapfile -d '' images < <(find . -type f -name 'PPSA*.ffpfsc' -print0)
          mapfile -d '' archives < <(find . -type f -name 'PPSA*.zip' -print0)
          mapfile -d '' checksums < <(find . -type f -name 'SHA256SUMS' -print0)
          if (( ${#images[@]} != 1 || ${#archives[@]} != 1 || ${#checksums[@]} != 1 )); then
            echo "Release files must be one FFPFSC image, one app-folder ZIP, and SHA256SUMS." >&2
            exit 1
          fi
          (cd "$(dirname "${checksums[0]}")" && sha256sum -c "$(basename "${checksums[0]}")")
          echo "image=${images[0]#./}" >> "$GITHUB_OUTPUT"
          echo "archive=${archives[0]#./}" >> "$GITHUB_OUTPUT"
          echo "checksum=${checksums[0]#./}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        run: |
          awk -v version="$GITHUB_REF_NAME" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.package.outputs.image }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("release/$IMAGE" "release/$ARCHIVE" "release/$CHECKSUM")
          image_name="${IMAGE##*/}"
          archive_name="${ARCHIVE##*/}"
          checksum_name="${CHECKSUM##*/}"
          release_flags=()
          case "$GITHUB_REF_NAME" in
            01.000.062|01.000.070|01.000.071|01.000.080|01.000.081|01.000.082|01.000.083)
              release_flags=(--prerelease --latest=false)
              ;;
          esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r old_asset; do
              if [[ $old_asset != "$image_name" && $old_asset != "$archive_name" && $old_asset != "$checksum_name" ]]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$old_asset" --yes --repo "$GITHUB_REPOSITORY"
              fi
            done < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "ProsperoLight $GITHUB_REF_NAME" --notes-file release-notes.md "${release_flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes-file release-notes.md \
              --title "ProsperoLight $GITHUB_REF_NAME" "${release_flags[@]}"
          fi
