<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title description" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title id="title">4K HEVC: bitrate the PS5 decoder keeps up with</title>
<desc id="description">Horizontal bars for 120, 90 and 60 frames per second. Green is smooth, amber is at the limit or not measured, red is where the decoder falls behind.</desc>
<rect x="0.5" y="0.5" width="899" height="379" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
<text x="28" y="38" font-size="18" font-weight="600" fill="#1f2328">4K HEVC: bitrate the PS5 decoder keeps up with</text>
<text x="28" y="60" font-size="12.5" fill="#59636e">Bitrate the host actually delivers. A bitrate setting is only reached in busy scenes.</text>
<text x="28" y="116.5" font-size="15" font-weight="600" fill="#1f2328">120 FPS</text>
<rect x="110.0" y="92" width="199.8" height="40" fill="#2da44e"/>
<rect x="309.8" y="92" width="49.9" height="40" fill="#d4a72c"/>
<rect x="359.7" y="92" width="500.3" height="40" fill="#cf222e"/>
<text x="28" y="176.5" font-size="15" font-weight="600" fill="#1f2328">90 FPS</text>
<rect x="110.0" y="152" width="290.3" height="40" fill="#2da44e"/>
<rect x="400.3" y="152" width="72.6" height="40" fill="#d4a72c"/>
<rect x="472.9" y="152" width="387.1" height="40" fill="#cf222e"/>
<text x="28" y="236.5" font-size="15" font-weight="600" fill="#1f2328">60 FPS</text>
<rect x="110.0" y="212" width="292.5" height="40" fill="#2da44e"/>
<rect x="402.5" y="212" width="188.2" height="40" fill="#d4a72c"/>
<rect x="590.6" y="212" width="269.4" height="40" fill="#cf222e"/>
<line x1="110.0" y1="266" x2="860.0" y2="266" stroke="#59636e" stroke-width="1"/>
<line x1="160.0" y1="92" x2="160.0" y2="252" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="160.0" y1="266" x2="160.0" y2="271" stroke="#59636e"/>
<text x="160.0" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328">20</text>
<line x1="210.0" y1="92" x2="210.0" y2="252" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="210.0" y1="266" x2="210.0" y2="271" stroke="#59636e"/>
<text x="210.0" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328">40</text>
<line x1="235.0" y1="92" x2="235.0" y2="252" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="235.0" y1="266" x2="235.0" y2="271" stroke="#59636e"/>
<text x="235.0" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328">50</text>
<line x1="260.0" y1="92" x2="260.0" y2="252" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="260.0" y1="266" x2="260.0" y2="271" stroke="#59636e"/>
<text x="260.0" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328">60</text>
<line x1="285.0" y1="92" x2="285.0" y2="252" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="285.0" y1="266" x2="285.0" y2="271" stroke="#59636e"/>
<text x="285.0" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328">70</text>
<line x1="310.0" y1="92" x2="310.0" y2="252" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="310.0" y1="266" x2="310.0" y2="271" stroke="#59636e"/>
<text x="310.0" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328">80</text>
<line x1="360.0" y1="92" x2="360.0" y2="252" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="360.0" y1="266" x2="360.0" y2="271" stroke="#59636e"/>
<text x="360.0" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328">100</text>
<line x1="485.0" y1="92" x2="485.0" y2="252" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="485.0" y1="266" x2="485.0" y2="271" stroke="#59636e"/>
<text x="485.0" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328">150</text>
<line x1="610.0" y1="92" x2="610.0" y2="252" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="610.0" y1="266" x2="610.0" y2="271" stroke="#59636e"/>
<text x="610.0" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328">200</text>
<line x1="860.0" y1="92" x2="860.0" y2="252" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="860.0" y1="266" x2="860.0" y2="271" stroke="#59636e"/>
<text x="860.0" y="285" font-size="11.5" text-anchor="middle" fill="#1f2328">300</text>
<text x="122.0" y="116.5" font-size="13" font-weight="600" fill="#ffffff">smooth up to 80 Mbps</text>
<text x="369.7" y="116.5" font-size="13" font-weight="600" fill="#ffffff">freezes above 100 Mbps</text>
<text x="122.0" y="176.5" font-size="13" font-weight="600" fill="#ffffff">smooth up to 115 Mbps</text>
<text x="482.9" y="176.5" font-size="13" font-weight="600" fill="#ffffff">freezes above 145 Mbps</text>
<text x="122.0" y="236.5" font-size="13" font-weight="600" fill="#ffffff">smooth up to 115 Mbps</text>
<text x="600.6" y="236.5" font-size="13" font-weight="600" fill="#ffffff">freezes above about 190 Mbps</text>
<text x="496.5" y="236.5" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">not measured</text>
<text x="860.0" y="302" font-size="11.5" text-anchor="end" fill="#59636e">bitrate presets, Mbps (400 and 500 are beyond every limit)</text>
<rect x="110.0" y="315" width="14" height="14" rx="3" fill="#2da44e"/>
<text x="130.0" y="327" font-size="12.5" fill="#1f2328">Smooth</text>
<rect x="186.6" y="315" width="14" height="14" rx="3" fill="#d4a72c"/>
<text x="206.6" y="327" font-size="12.5" fill="#1f2328">At the limit, or not measured</text>
<rect x="403.5" y="315" width="14" height="14" rx="3" fill="#cf222e"/>
<text x="423.5" y="327" font-size="12.5" fill="#1f2328">Decoder falls behind: latency grows, then freezes</text>
<text x="28" y="356" font-size="11.5" fill="#59636e">Measured on PS5 with HEVC SDR and eight slices per frame, decoding one frame at a time. 1440p and 1080p: at least these limits.</text>
</svg>
